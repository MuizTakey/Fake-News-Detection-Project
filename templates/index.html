<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fake News Detector</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: url("/static/background image.jpg") no-repeat center center fixed;
      background-size: cover;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      color: #333;
    }

    .container {
      background-color: rgba(255, 255, 255, 0.9);
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
      width: 95%;
      max-width: 900px;
      text-align: center;
      animation: fadeIn 0.5s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    header h1 {
      color: #2c3e50;
      font-size: 2.2em;
      font-weight: 700;
    }

    .tab-content {
      margin-top: 20px;
      text-align: left;
    }

    textarea {
      width: 100%;
      height: 150px;
      padding: 15px;
      border: 2px solid #4c7b8fff;
      border-radius: 10px;
      font-size: 1em;
      resize: vertical;
    }

    button {
      background-color: #6e8efb;
      color: white;
      padding: 10px 25px;
      border: none;
      border-radius: 25px;
      font-size: 1.1em;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover {
      background-color: #5c7cfa;
      transform: scale(1.05);
    }

    .result {
      font-size: 1.4em;
      font-weight: 600;
      margin: 20px 0;
      padding: 10px;
      border-radius: 8px;
      min-height: 30px;
    }

    .result.real {
      color: #27ae60;
      background-color: #e8f5e9;
    }

    .result.fake {
      color: #c0392b;
      background-color: #fce4e4;
    }

    .table-container {
      max-height: 400px;
      overflow-y: auto;
      border: 1px solid #ccc;
    }

    ul.list-group {
      max-height: 400px;
      overflow-y: auto;
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="mb-3">
      <h1>Fake News Detection using PSO + XGBoost</h1>
    </header>

    <!-- Navigation Tabs -->
    <ul class="nav nav-tabs" id="tabs">
      <li class="nav-item"><a class="nav-link active" data-bs-toggle="tab" href="#dataset">Dataset</a></li>
      <li class="nav-item"><a class="nav-link" data-bs-toggle="tab" href="#features">Selected Features</a></li>
      <li class="nav-item"><a class="nav-link" data-bs-toggle="tab" href="#predict">Prediction</a></li>
    </ul>

    <div class="tab-content mt-3">
      <!-- Dataset Tab -->
      <div class="tab-pane fade show active" id="dataset">
        <h4>Loaded Dataset Preview</h4>
        <button id="loadDataset" class="btn btn-primary mb-3">Load Dataset</button>
        <div id="datasetPreview" class="table-container"></div>
      </div>

      <!-- Feature Selection Tab -->
      <div class="tab-pane fade" id="features">
        <h4>Selected Features for Classification</h4>
        <button id="loadFeatures" class="btn btn-success mb-3">Show Features</button>
        <ul id="featureList" class="list-group"></ul>
      </div>

      <!-- Prediction Tab -->
      <div class="tab-pane fade" id="predict">
        <div class="input-section">
          <label for="newsInput" class="form-label">Enter News Article:</label>
          <textarea id="newsInput" placeholder="Paste your news article here..."></textarea>
        </div>
        <button id="predictButton">Predict</button>
        <div id="result" class="result"></div>
        <div id="status" class="status mt-2">Ready to predict...</div>
      </div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    // Load dataset preview
    $('#loadDataset').click(() => {
      $('#datasetPreview').html('<p>Loading dataset...</p>');
      $.get('/load_dataset', data => {
        if (data.status === 'success') {
          Swal.fire({
            icon: 'success',
            title: 'Success!',
            text: data.message || 'Dataset loaded successfully.',
            showConfirmButton: false,
            timer: 2000
          });

          let html = '<table class="table table-bordered table-sm"><thead><tr>';
          data.columns.forEach(c => html += `<th>${c}</th>`);
          html += '</tr></thead><tbody>';
          data.preview.forEach(row => {
            html += '<tr>';
            data.columns.forEach(c => html += `<td>${row[c]}</td>`);
            html += '</tr>';
          });
          html += '</tbody></table>';
          $('#datasetPreview').html(html);
        } else {
          Swal.fire('Error', data.error || 'Unknown error loading dataset.', 'error');
        }
      }).fail(() => {
        Swal.fire('Error', 'Failed to connect to server.', 'error');
      });
    });

    // Load selected features
    $('#loadFeatures').click(() => {
      $('#featureList').html('<li class="list-group-item">Loading features...</li>');
      $.get('/selected_features', data => {
        if (data.status === 'success') {
          let html = '';
          data.features.forEach(f => html += `<li class="list-group-item">${f}</li>`);
          $('#featureList').html(html);
        } else {
          $('#featureList').html(`<li class="list-group-item text-danger">${data.error}</li>`);
        }
      }).fail(() => {
        $('#featureList').html('<li class="list-group-item text-danger">Failed to load features.</li>');
      });
    });

    // Predict news
    document.getElementById('predictButton').addEventListener('click', async () => {
      const newsInput = document.getElementById('newsInput').value.trim();
      const resultDiv = document.getElementById('result');
      const statusDiv = document.getElementById('status');

      if (!newsInput) {
        Swal.fire('Warning', 'Please enter a news article.', 'warning');
        return;
      }

      statusDiv.textContent = 'Predicting...';
      resultDiv.textContent = '';

      try {
        const response = await fetch("/predict", {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text: newsInput })
        });
        const data = await response.json();

        if (data.error) {
          Swal.fire('Error', data.error, 'error');
          return;
        }

        Swal.fire({
          icon: 'info',
          title: 'Prediction Complete',
          text: `The news is ${data.prediction.toUpperCase()}`,
          timer: 2500
        });

        resultDiv.textContent = `Prediction: The news is ${data.prediction}`;
        resultDiv.className = `result ${data.prediction}`;
        statusDiv.textContent = 'Prediction complete.';
      } catch (error) {
        Swal.fire('Error', 'Failed to connect to Flask API.', 'error');
      }
    });
  </script>
</body>
</html>
